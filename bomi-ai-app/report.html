<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>보미 가족 리포트</title>
<style>
  :root{
    --blue:#9C7A54;
    --navy:#6F5636;
    --navy-dark:#4E3C26;
    --accent-soft:#F0E7D8;
    --ink:#23201B;
    --sub:#7A6F5F;
    --bg:#F6F3EE;
    --card:#FFFFFF;
    --line:#E7E1D6;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",-apple-system,sans-serif;
    background:var(--bg); color:var(--ink); min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{ max-width:480px; margin:0 auto; min-height:100vh; background:var(--bg); }

  .header{ padding:20px 22px 16px; background:linear-gradient(155deg, var(--navy) 0%, var(--navy-dark) 100%); color:#fff; }
  .header .eyebrow{ font-size:12px; font-weight:700; opacity:.8; letter-spacing:0.3px; margin-bottom:6px; }
  .header h1{ font-size:21px; font-weight:800; margin:0; }

  .metric-row{ display:flex; gap:12px; padding:18px 20px 4px; }
  .metric-card{ flex:1; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px 14px; text-align:center; }
  .metric-card .val{ font-size:24px; font-weight:800; color:var(--navy); }
  .metric-card .lb{ font-size:12px; color:var(--sub); margin-top:4px; font-weight:600; }

  .section{ padding:22px 20px 4px; }
  .section h2{ font-size:15px; font-weight:800; margin:0 0 12px; }
  .trend-card{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px 16px 14px; }
  .trend-row{ margin-bottom:16px; }
  .trend-row:last-child{ margin-bottom:0; }
  .trend-row .trend-label{ font-size:12.5px; font-weight:700; color:var(--sub); margin-bottom:8px; }
  .bars{ display:flex; align-items:flex-end; gap:4px; height:56px; }
  .bar{ flex:1; background:var(--accent-soft); border-radius:4px 4px 0 0; min-height:3px; position:relative; }
  .bar.has-data{ background:var(--blue); }
  .bar-labels{ display:flex; gap:4px; margin-top:6px; }
  .bar-labels span{ flex:1; text-align:center; font-size:9.5px; color:var(--sub); }

  .empty-note{ font-size:13px; color:var(--sub); text-align:center; padding:40px 20px; }

  .footer-note{ padding:26px 22px 40px; font-size:11.5px; color:var(--sub); line-height:1.7; border-top:1px solid var(--line); margin-top:24px; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="header">
    <div class="eyebrow">보미 가족 리포트</div>
    <h1 id="titleText">불러오는 중...</h1>
  </div>
  <div id="content"></div>
</div>

<script>
function qs(name){ return new URLSearchParams(location.search).get(name); }

function renderBars(rows, key, formatter){
  // 최근 28일 중 최근 14일만 촘촘히 보여줌(막대가 너무 가늘어지지 않도록)
  const last14 = rows.slice(-14);
  const values = last14.map(r => (typeof r[key] === 'number' ? r[key] : null));
  const max = Math.max(1, ...values.filter(v => v !== null));
  const bars = values.map(v => {
    const h = v === null ? 3 : Math.max(4, Math.round((v / max) * 56));
    return `<div class="bar${v !== null ? ' has-data' : ''}" style="height:${h}px" title="${v !== null ? formatter(v) : '기록 없음'}"></div>`;
  }).join('');
  const labels = last14.map((r,i) => (i % 3 === 0 ? String(Number(r.summary_date.slice(8,10))) : '')).map(l=>`<span>${l}</span>`).join('');
  return `<div class="bars">${bars}</div><div class="bar-labels">${labels}</div>`;
}

async function load(){
  const token = qs('token');
  const content = document.getElementById('content');
  if(!token){
    document.getElementById('titleText').textContent = '보미 가족 리포트';
    content.innerHTML = '<div class="empty-note">링크가 올바르지 않아요.</div>';
    return;
  }
  try{
    const res = await fetch(`/api/notifications?action=family-report&token=${encodeURIComponent(token)}`);
    const data = await res.json();
    if(!res.ok || !data.ok){
      document.getElementById('titleText').textContent = '보미 가족 리포트';
      content.innerHTML = `<div class="empty-note">${(data && data.message) || '리포트를 불러오지 못했어요.'}</div>`;
      return;
    }
    document.getElementById('titleText').textContent = `${data.memberName}님의 소식`;

    const daily = data.daily || [];
    const withChecklist = daily.filter(r => r.checklist_total);
    const totalCompleted = withChecklist.reduce((s,r)=>s+(r.checklist_completed||0),0);
    const totalTarget = withChecklist.reduce((s,r)=>s+(r.checklist_total||0),0);
    const rate = totalTarget > 0 ? Math.round((totalCompleted/totalTarget)*100) : null;
    const withSteps = daily.filter(r => typeof r.steps === 'number');
    const avgSteps = withSteps.length > 0 ? Math.round(withSteps.reduce((s,r)=>s+r.steps,0)/withSteps.length) : null;

    if(daily.length === 0){
      content.innerHTML = '<div class="empty-note">아직 쌓인 기록이 없어요. 다음 주에 다시 확인해 주세요.</div>' + footerNote();
      return;
    }

    content.innerHTML = `
      <div class="metric-row">
        <div class="metric-card">
          <div class="val">${rate === null ? '-' : rate+'%'}</div>
          <div class="lb">최근 4주 체크리스트 완료율</div>
        </div>
        <div class="metric-card">
          <div class="val">${avgSteps === null ? '-' : avgSteps.toLocaleString('ko-KR')}</div>
          <div class="lb">하루 평균 걸음수</div>
        </div>
      </div>
      <div class="section">
        <h2>최근 2주 추이</h2>
        <div class="trend-card">
          <div class="trend-row">
            <div class="trend-label">체크리스트 완료 개수</div>
            ${renderBars(daily, 'checklist_completed', v => v+'개')}
          </div>
          <div class="trend-row">
            <div class="trend-label">걸음수</div>
            ${renderBars(daily, 'steps', v => v.toLocaleString('ko-KR')+'보')}
          </div>
        </div>
      </div>
      ${footerNote()}
    `;
  }catch(e){
    document.getElementById('titleText').textContent = '보미 가족 리포트';
    content.innerHTML = '<div class="empty-note">리포트를 불러오는 중 문제가 생겼어요.</div>';
  }
}

function footerNote(){
  return `<div class="footer-note">이 리포트는 체크리스트 완료 여부와 실제 걸음수 기록만 보여드려요. 대화 원문은 절대 포함되지 않고, 보미와 나눈 이야기는 부모님 본인만 볼 수 있어요. 구독은 부모님이 보미 앱에서 언제든 철회하실 수 있어요.</div>`;
}

load();
</script>
</body>
</html>
