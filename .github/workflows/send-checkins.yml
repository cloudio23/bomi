name: Send Bomi check-in pushes

# Vercel의 자체 Cron Jobs 기능은 Hobby(무료) 플랜에서 하루 1회로 제한되어,
# 4개 시간대(수면/식사/활동/기분) 안부 문자 기능을 매시간 확인할 수 없습니다.
# 대신 GitHub Actions의 무료 스케줄 트리거로 매시 정각에 배포된 API를
# 호출합니다 (Vercel 요금제 업그레이드 없이 동작).
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/send-checkins
        run: curl -sf https://bomi-7sbu.vercel.app/api/send-checkins
